version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    reviewers:
      - Soturine
    labels:
      - dependencies
      - python
    groups:
      # Correções de segurança chegam separadas do lote de versões: um pacote incompatível no
      # lote (ex.: snapshot OpenAPI após FastAPI) não pode segurar um patch de segurança.
      # Efetivo quando Dependabot alerts/security updates estiverem habilitados no repositório.
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
      backend-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    reviewers:
      - Soturine
    labels:
      - dependencies
      - javascript
    groups:
      # Correções de segurança chegam separadas do lote de versões: um pacote incompatível no
      # lote (ex.: snapshot OpenAPI após FastAPI) não pode segurar um patch de segurança.
      # Efetivo quando Dependabot alerts/security updates estiverem habilitados no repositório.
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
      frontend-compatible:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    reviewers:
      - Soturine
    labels:
      - dependencies
      - github_actions
    groups:
      actions-compatible:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
