name: CI

on:
  push:
  pull_request:

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Text and encoding
        run: python scripts/check_text_quality.py
      - name: Markdown links
        run: python scripts/check_markdown_links.py
      - name: Assets
        run: python scripts/check_assets.py
      - name: Version consistency
        run: python scripts/check_version_consistency.py
      - name: Commit whitespace consistency
        run: git show --check --oneline --format= HEAD

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt && python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Component tests
        run: npm run test -- --run
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Install E2E backend
        working-directory: backend
        run: python -m pip install -r requirements-lock.txt
      - name: Browser E2E
        run: npm run test:e2e

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prescripta
          POSTGRES_PASSWORD: prescripta_ci
          POSTGRES_DB: prescripta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prescripta -d prescripta_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PRESCRIPTA_ENV: test
      PRESCRIPTA_AUTO_SEED: "false"
      PRESCRIPTA_DATABASE_URL: postgresql+psycopg://prescripta:prescripta_ci@localhost:5432/prescripta_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Migration round trip
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check

  smoke:
    needs: [repository-quality, backend, frontend, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked backend
        working-directory: backend
        run: python -m pip install -r requirements-lock.txt
      - name: Controlled API smoke
        working-directory: backend
        run: python -m pytest tests/test_product_readiness_v081.py tests/test_auth_api.py --maxfail=1

  release-readiness:
    needs: [repository-quality, backend, frontend, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          if failed:
              print(f"Release bloqueada: {failed}")
              sys.exit(1)
          print("Release readiness OK.")
          PY
