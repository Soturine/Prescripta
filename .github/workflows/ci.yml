name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Text and encoding
        run: python scripts/check_text_quality.py
      - name: Markdown links
        run: python scripts/check_markdown_links.py
      - name: Assets
        run: python scripts/check_assets.py
      - name: Version consistency
        run: python scripts/check_version_consistency.py
      - name: Commit whitespace consistency
        run: git show --check --oneline --format= HEAD

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt && python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: >-
          python -m pytest --cov=app --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-report=json:coverage.json --cov-fail-under=0
      - name: Independent coverage ratchets
        run: python ../scripts/check_coverage_ratchet.py coverage.json --combined 82 --branches 65

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm install --global npm@11.18.0 && python ../scripts/check_install_scripts.py && npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: i18n catalog gates
        run: node ../scripts/check_i18n_catalogs.mjs
      - name: Component tests and coverage gates
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Install E2E backend
        working-directory: backend
        run: python -m pip install -r requirements-lock.txt
      - name: Browser E2E
        run: npm run test:e2e -- --grep-invert @visual

  frontend-visual:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm install --global npm@11.18.0 && python ../scripts/check_install_scripts.py && npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Install E2E backend
        working-directory: backend
        run: python -m pip install -r requirements-lock.txt
      - name: Stable Chromium snapshots
        run: npm run test:e2e:visual

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prescripta
          POSTGRES_PASSWORD: prescripta_ci
          POSTGRES_DB: prescripta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prescripta -d prescripta_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PRESCRIPTA_ENV: test
      PRESCRIPTA_AUTO_SEED: "false"
      PRESCRIPTA_DATABASE_URL: postgresql+psycopg://prescripta:prescripta_ci@localhost:5432/prescripta_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Migration round trip
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check

  smoke:
    needs: [repository-quality, backend, frontend, frontend-visual, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Controlled API smoke
        working-directory: backend
        run: python -m pytest tests/test_product_readiness_v081.py tests/test_auth_api.py --maxfail=1

  release-readiness:
    needs: [repository-quality, backend, frontend, frontend-visual, postgres, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          if failed:
              print(f"Release bloqueada: {failed}")
              sys.exit(1)
          print("Release readiness OK.")
          PY
