name: Qualification

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact final SHA to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qualification-${{ inputs.target_sha }}
  cancel-in-progress: true

jobs:
  final-only:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prescripta
          POSTGRES_PASSWORD: qualification
          POSTGRES_DB: prescripta_source
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prescripta -d prescripta_source"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Require exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.target_sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install qualification dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Prove v0.9.3 to v0.10.0 migration
        working-directory: backend
        env:
          PRESCRIPTA_DATABASE_URL: postgresql+psycopg://prescripta:qualification@localhost:5432/prescripta_source
        run: |
          alembic upgrade f3a91c7d2b40
          alembic upgrade head
          alembic current
          alembic check
      - name: Seed bounded recovery probe and target database
        env:
          PGPASSWORD: qualification
        run: |
          psql -h localhost -U prescripta -d prescripta_source -c 'CREATE TABLE qualification_probe(id integer primary key); INSERT INTO qualification_probe VALUES (1),(2);'
          createdb -h localhost -U prescripta prescripta_restore
      - name: PostgreSQL backup and restore exercise
        env:
          PRESCRIPTA_BACKUP_SOURCE_URL: postgresql://prescripta:qualification@localhost:5432/prescripta_source
          PRESCRIPTA_RESTORE_TARGET_URL: postgresql://prescripta:qualification@localhost:5432/prescripta_restore
        run: |
          docker run --rm --network host \
            --env PRESCRIPTA_BACKUP_SOURCE_URL \
            --env PRESCRIPTA_RESTORE_TARGET_URL \
            --volume "$PWD/scripts/postgres-backup-restore.sh:/usr/local/bin/postgres-backup-restore.sh:ro" \
            postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f \
            bash /usr/local/bin/postgres-backup-restore.sh | tee recovery-evidence.json
      - name: Bounded synthetic benchmarks
        run: python scripts/benchmark_v010.py | tee benchmark-evidence.json
      - name: Focused fault and interoperability qualification
        run: >-
          python -m pytest
          backend/tests/test_bounded_numeric_scanner_v093.py
          backend/tests/test_causal_reference_v093.py
          backend/tests/test_evidence_agent_v093.py
          backend/tests/test_fhir_interoperability_v010.py
          backend/tests/test_observability_v010.py -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-evidence-${{ inputs.target_sha }}
          path: |
            recovery-evidence.json
            benchmark-evidence.json
          retention-days: 30
