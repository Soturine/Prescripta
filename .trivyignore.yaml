vulnerabilities:
  # Aceitação temporária, revisada em 2026-11-08 (docs/security/accepted-risks.md).
  # Debian corrigiu em 1:1.3.dfsg+really1.3.1-1+deb13u1 (DSA-6613-1), mas o digest mais recente
  # de gcr.io/distroless/cc-debian13:nonroot ainda traz +b1. Ambos atingem apenas a API gz*
  # (gzwrite/gzprintf), não usada por CPython (zlib usa deflate/inflate; gzip é Python puro).
  # Remover ao trocar o digest; o PURL exato limita a exceção a este pacote/versão.
  - id: CVE-2026-85091
    purls:
      - "pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1?arch=amd64&distro=debian-13.7&epoch=1"
    expired_at: 2026-11-22
    statement: >-
      zlib gz_vacate heap overflow via non-blocking gzwrite/gzprintf; gz* file API not used by
      the backend runtime. Fixed in Debian deb13u1, not yet in the distroless base.
  - id: CVE-2026-76844
    purls:
      - "pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1?arch=amd64&distro=debian-13.7&epoch=1"
    expired_at: 2026-11-22
    statement: >-
      zlib gz_write stale next_in after failed write(); gz* file API not used by the backend
      runtime. Fixed in Debian deb13u1, not yet in the distroless base.
