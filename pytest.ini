# Lets the backend suite run from the repository root (tools that collect from the root, such as
# Assertiva --execute, and anyone typing `pytest` here). Paths are relative to this file, so they stay
# inside whatever copy is being tested. From backend/, pytest still uses backend/pyproject.toml.
# Keep both in sync: same test paths, same import root.
[pytest]
testpaths = backend/tests
pythonpath = backend
